# @package network
# Action-only DDT policy trunk with PER-TOKEN encoder->decoder cond. Same
# knobs as ``lbmdit_ddt_ns`` (config is interchangeable); the trunk class
# (``LBMDiTDDTPT``) replaces the global-cond + mean-pool bridge with a
# per-token AdaLN bridge (no pool). Drop-in replacement for ``lbmdit_ddt``
# at the trunk layer; works with the noise-shift loss/sampler too —
# identity defaults (policy_t_shift=1.0, policy_t_dist=uniform) recover
# plain flow matching on the new trunk.
defaults:
  - _base
  - _self_

network_type: "lbmdit_ddt_pt"
emb_dim: 256                # default d_model_enc when policy_ddt_d_model_enc is null
num_layers: 6               # unused by DDT trunk; depths set below
dropout: 0.0
timestep_emb_dim: 128       # general default; trunk uses policy_ddt_timestep_emb_dim if non-null
encoder_out_dim: 256        # encoder output dim (= obs_dim fed to network)

# DDT-specific knobs (shared with lbmdit_ddt_ns)
policy_ddt_enc_depth: 4
policy_ddt_dec_depth: 2
policy_ddt_d_model_enc: 256
policy_ddt_d_model_dec: 512  # shallow wide head
policy_ddt_n_heads_enc: 8
policy_ddt_n_heads_dec: 8
policy_ddt_timestep_emb_dim: 128

# General DiT knobs (kept for compatibility; not consumed by DDT trunk)
n_heads: 8
timestep_emb_type: "positional"
