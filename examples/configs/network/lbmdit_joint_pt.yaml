# @package network
# Single-trunk joint flow matching DiT over (next_state, action_chunk).
# Vanilla single-stack DiT (one width, one depth) with per-token AdaLN cond
# and decoupled state/action flow times — i.e. all the LBMDiTJointDDT
# agent features except the encoder/decoder width split. Runs on top of
# an end-to-end-trained image encoder (LBMDiTJointPTAgent) with a learnable
# LayerNorm on the FM target.
defaults:
  - _base
  - _self_

network_type: "lbmdit_joint_pt"
emb_dim: 256                # d_model of the single trunk
num_layers: 8               # depth (transformer blocks)
dropout: 0.0
timestep_emb_dim: 128       # decoupled from d_model
encoder_out_dim: 256        # encoder output dim (= obs_dim fed to network)

# DiT specific
n_heads: 8
timestep_emb_type: "positional"

# Optimality embedding width (null -> d_model)
joint_opt_emb_dim: null

# Per-token cond composition: "add" (sum at d_model) or "concat" (3*d_model)
joint_cond_compose: "add"
