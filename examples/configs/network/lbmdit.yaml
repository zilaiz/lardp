# @package network
defaults:
  - _base
  - _self_

network_type: "lbmdit"
emb_dim: 256  # Used as d_model
num_layers: 8  # Used as depth
dropout: 0.0
timestep_emb_dim: 128
encoder_out_dim: 256

# LBMDiT specific configs
n_heads: 8  # Number of attention heads
timestep_emb_type: "positional"  # Options: positional, sinusoidal, fourier

# --- Optimality conditioning (play/expert), vanilla LBMDiT ---
# Off by default => byte-identical to plain DP (no extra params, loads old
# checkpoints unchanged). Mirrors franka_diff's network/lbmdit.yaml so the same
# checkpoints stay deploy-compatible. Consumed by TrainingAgent only when
# use_optimality=true; reuses optimization.expert_sample_fraction /
# optimization.opt_cfg_dropout_prob.
use_optimality: false      # master toggle; false = byte-identical to plain DP
opt_emb_dim: null          # embedding width (null -> emb_dim)
opt_cond_compose: "add"    # "add" (into time features) | "concat" (append)
