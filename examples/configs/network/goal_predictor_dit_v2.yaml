# @package network
# Goal predictor DiT trained on top of an lbmidm_v2 (IDM+FDM) checkpoint.
defaults:
  - lbmidm_v2
  - _self_

# Goal predictor DiT architecture (mirrors goal_predictor_dit.yaml)
goal_dit_depth: 8
goal_dit_n_heads: 8
goal_dit_d_model: null    # null = use emb_dim
goal_dit_dropout: 0.0
goal_dit_projector_dim: null  # null = 2 * d_model
goal_dit_timestep_emb_dim: 256  # null = use goal_dit_d_model
goal_align_depth: 5       # which layer to extract intermediate states from
