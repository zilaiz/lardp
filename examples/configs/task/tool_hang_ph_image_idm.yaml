# @package task
defaults:
  - robomimic_base
  - _self_

env_name: "tool_hang"
obs_type: "image"
env_type: "ph"

dataset_paths:
  - data/robomimic/tool_hang/ph/image_v15.hdf5
  - data/robomimic/tool_hang/image_rollouts_clipped.hdf5
abs_action: false
action_type: "delta"

max_episode_steps: 700
render_obs_key: "sideview_image"

# Required keys
horizon: 10
act_dim: 7

shape_meta:
  action:
    shape:
      - 7
  obs:
    sideview_image:
      shape:
        - 3
        - 84
        - 84
      type: rgb
    robot0_eye_in_hand_image:
      shape:
        - 3
        - 84
        - 84
      type: rgb
    robot0_eef_pos:
      shape:
        - 3
      type: low_dim
    robot0_eef_quat:
      shape:
        - 4
      type: low_dim
    robot0_gripper_qpos:
      shape:
        - 2
      type: low_dim

num_envs: 4
