# @package task
defaults:
  - robomimic_base
  - _self_

env_name: "can"
obs_type: "image"
env_type: "ph"

# HuggingFace dataset configuration - auto-downloads from the repository
# dataset_filename: "robomimic/can/ph/image.hdf5"

# Alternative: Use original repo with demo dataset (requires local processing)
# dataset_repo: "amandlek/robomimic"
# dataset_filename: "v1.5/can/ph/demo_v15.hdf5"

dataset_path: "data/robomimic/can/ph/image_v15_256.hdf5"
prep_dataset_path: "data/robomimic/can/ph/image_v15_prep_256.hdf5"

max_episode_steps: 400
render_obs_key: "agentview_image"

# Required keys
horizon: 10
act_dim: 10

shape_meta:
  action:
    shape:
      - 10
  obs:
    agentview_image:
      shape:
        - 3
        - 256
        - 256
      type: rgb
    robot0_eef_pos:
      shape:
        - 3
      type: low_dim
    robot0_eef_quat:
      shape:
        - 4
      type: low_dim
    robot0_gripper_qpos:
      shape:
        - 2
      type: low_dim
    robot0_eye_in_hand_image:
      shape:
        - 3
        - 256
        - 256
      type: rgb

num_envs: 4

# crop_shape:
#   - 232
#   - 232

resize_shape: 
  - 84
  - 84
crop_shape:
  - 76
  - 76
