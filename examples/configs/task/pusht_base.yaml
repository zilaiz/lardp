# @package task
# Shared base configuration for all pusht tasks
defaults:
  - _self_

env_name: "pusht"
env_type: "ph"
abs_action: false

# Dataset configuration — read the expert zarr directly from the local path,
# no HuggingFace lookup. Download it once with:
#   hf ChaoyiPan/mip-dataset : pusht/pusht_cchi_v7_replay.zarr.zip -> data/pusht
# dataset_path takes precedence in make_dataset; the HF fields are nulled so the
# online repo is never consulted (set them to re-enable auto-download).
dataset_path: "data/pusht/pusht_cchi_v7_replay.zarr"
dataset_repo: null
dataset_filename: null

# Rollout mixing (PushT). rollout_dataset_paths: null = expert-only (overridden
# by _mixed task configs). rollout_use_fraction: fraction of rollout demos used
# (first-N, collection order); 1.0 = all. Declared here so they're valid struct
# keys / CLI-overridable on any pusht task.
rollout_dataset_paths: null
rollout_use_fraction: 1.0

max_episode_steps: 300

# Referenced by main.yaml's exp_name interpolation (${task.latent_type}); kept
# null since PushT has no LAM/DINO latent variants.
latent_type: null

# Common required keys
obs_steps: 2
act_steps: 8
horizon: 16
num_envs: 20
save_video: false
val_dataset_percentage: 0.0
act_dim: 2

# Common image encoder settings (for image-based tasks)
rgb_model: resnet18
resize_shape: null
crop_shape: [84, 84]
random_crop: true
use_group_norm: true
use_seq: true
