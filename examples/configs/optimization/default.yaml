# @package optimization
defaults:
  - _self_

seed: 0
loss_type: "flow"
loss_scale: 0.1
cls_loss_scale: 0.03
repa_scale: 0.5 # REPA loss coefficient
s_align_depth: [4]
t_align_depth: [4]
norm_type: "l2" # "l1", "l2", "smooth_l1"
lr: 1e-4
weight_decay: 1e-5
num_steps: 1
sample_mode: "zero"
goal_sample_mode: null  # null = inherit sample_mode; set "stochastic"/"zero" to override only the goal ODE
t_two_step: 0.9
discrete_dt: 0.01
grad_clip_norm: 10.0
ema_rate: 0.999
batch_size: 1024
gradient_steps: 300000
warmup_ratio: 0.2
rampup_ratio: 0.5
min_value: 0.0
max_value: 1.0
model_path: null
# Load encoder weights from a pretrained IDM checkpoint (lbmdit ablation).
# freeze=true  -> encoder + encoder_ema both seeded from IDM's encoder_ema (teacher), encoder frozen
# freeze=false -> encoder <- IDM encoder, encoder_ema <- IDM encoder_ema, finetune continues
pretrained_encoder_path: null
freeze_encoder: false
interp_type: "linear"
device: "cuda"
use_compile: false
compile_mode: null # Compile mode: null, "default", "reduce-overhead", "max-autotune"
use_cudagraphs: false # Whether to use CUDA graphs (requires static shapes)
auto_resume: true

extra_cond_dropout_warmup_steps: 5000
extra_cond_dropout_rampup_steps: 10000
diagnose_teacher_delta: false

# IDM goal dropout (classifier-free guidance style)
goal_dropout_prob: 0.0
# IDM encoder local-linearity regularizer weight (0 disables)
local_linearity_coef: 0.0

# Goal predictor specific
idm_checkpoint_path: null
state_matching_weight: 0.0
cfg_scale: 1.0

# Goal predictor DiT specific
goal_flow_num_steps: 5
goal_flow_loss_scale: 1.0
action_reg_weight: 1.0
action_reg_t_weighting: linear  # per-sample t-weighting of action loss: "none" | "linear"
action_reg_num_steps: 1         # K Euler steps from x_t -> g_hat for action_reg_loss; 1 = original one-step shortcut
goal_stats_path: null
delta_stats_path: null         # path to precomputed delta (= z_goal - z_last_obs) stats for the delta predictor

# Goal predictor DDT-NS (noise-shift) variant only. Identity defaults so
# leaving them untouched recovers the plain GP behavior.
goal_t_shift: 1.0               # SD3 shift t' = a*t / (1 + (a-1)*t); 1.0 = no shift
goal_t_dist: "uniform"          # "uniform" | "logit_normal"
goal_t_dist_mu: 0.0             # logit_normal mean (sigmoid(N(mu, sigma)))
goal_t_dist_sigma: 1.0          # logit_normal std
goal_t_eps: 0.0                 # clamp t to [eps, 1-eps] at training + inference

# Policy DDT-NS (noise-shift) — used by ``flow_ns`` loss + ``ode_ns_sampler``.
# Identity defaults recover plain flow matching.
policy_t_shift: 1.0             # SD3 shift on the policy flow time; 1.0 = no shift
policy_t_dist: "uniform"        # "uniform" | "logit_normal"
policy_t_dist_mu: 0.0
policy_t_dist_sigma: 1.0
policy_t_eps: 0.0

# Goal predictor o2g specific (VITA-style FLC, opt-in)
consistency_weight: 0.0          # 0 = disabled (FM only)
consistency_num_steps: null      # null -> use goal_flow_num_steps

# Goal predictor regressor specific (deterministic L2 + action FM head)
goal_l2_weight: 1.0              # weight for L2 loss on expert goal embedding
goal_l2_target_space: "raw"      # "normalized" or "raw"; with goal_stats_path=null falls back to "raw"

# Goal predictor retrieval specific (non-parametric NN over training goals)
retrieval_index_path: null       # path to .pt index built by scripts/build_goal_retrieval_index.py
retrieval_query_space: "obs_summary"  # "flatten_zt" | "obs_summary"
retrieval_distance: "l2"         # "l2" | "cosine"
retrieval_top_k: 1
retrieval_aggregation: "top1"    # "top1" | "weighted"
retrieval_temperature: 1.0       # softmax temperature for the weighted aggregation
# If true, inject retrieved (obs_summary, goal) pair directly into the IDM
# action trunk via forward_with_summary, bypassing the IDM's obs_summarizer.
# Requires query_space="obs_summary" + a v2 IDM (forward_with_summary).
retrieval_use_retrieved_pair: false

# BYOL-FDM proprioception reconstruction auxiliary (FDMAgent).
# When > 0, FDMNet's proprio_decoder predicts the per-frame low-dim obs
# from the encoded latent. Acts as a non-collapsible supervised signal on
# the encoder (mirrors TDMPC2's use of supervised heads to prevent collapse).
proprio_recon_loss_scale: 0.0  # 0 = disabled

# Downstream loading knob (LBMDiTJointDDTFrozenFDMAgent only): when true,
# initialize the input encoder from state_dict["encoder_ema"] (BYOL EMA
# target) instead of state_dict["encoder"] (online).
joint_use_encoder_ema_for_init: false

# IDM + FDM joint training (lbmidm_v2 / IDMFDMAgent)
fdm_loss_scale: 0.0  # weight for forward-dynamics auxiliary (0 = disabled)
# Ortho regularizer: hinge penalty on cos_sim(z_obs[-1], z_goal), active when
# cos_sim > ortho_reg_threshold. Raw encoder outputs.
ortho_reg_weight: 0.0
ortho_reg_threshold: 0.5

# LBMDiTJoint (single-stage joint state+action DiT) ----------------------
# Per-stream loss weights — agent normalizes each stream by its dim before
# applying these, so 1.0/1.0 means "equal per-element MSE".
joint_state_loss_weight: 1.0
joint_action_loss_weight: 1.0
# CFG dropout fraction (override expert label with null/play). 0.0 because
# play data trains the null slot directly; raise only for extra null-slot
# regularization in mixed-data training.
joint_cfg_dropout_prob: 0.0
# Inference-time CFG strength `w` in v_guided = (1+w)*v_cond - w*v_uncond.
# 0 = plain conditional sampling (one fwd pass per ODE step).
joint_cfg_scale: 0.0
# ODE source for sampling (state and action streams share this).
joint_sample_mode: "stochastic"  # "stochastic" | "zero"
# Default Euler steps for joint ODE sampling. The training-time eval loop
# overrides this via get_default_step_list, so this only matters for external
# rollout / deployment scripts that call agent.sample() without num_steps.
joint_num_steps: 5
# Whether to freeze the IDM-pretrained encoder during joint training.
joint_freeze_encoder: true
# LBMDiTJointDDTFrozenAgent only: if true, the input/conditioning encoder is
# initialized from idm_checkpoint_path and fine-tuned alongside the trunk,
# while a separate frozen snapshot of the same IDM weights computes the FM
# state target. Overrides joint_freeze_encoder when true.
joint_finetune_input_encoder: false
# DP-pretrained encoder source (LBMDiTJointDDTFrozenDPAgent variant). Path
# to a pretrained LBMDiT (DP) checkpoint whose encoder weights will be
# loaded into the joint trunk. Mutually exclusive with idm_checkpoint_path
# for that agent.
dp_checkpoint_path: null
# If True, load weights from `encoder_ema` rather than `encoder` — the
# smoother choice for downstream feature use.
dp_use_encoder_ema: true
# E2E variant only (LBMDiTJointE2EAgent): learnable gamma/beta on the
# target LayerNorm. Default false removes the gamma->0 collapse mode;
# flip to true for the UNITE-faithful variant.
joint_target_ln_affine: false
# E2E + DDT variants: use EMA encoder + EMA target_ln to compute the FM
# state target during training (self-distillation fix for moving-target).
# Reuses ema_rate above. Active only when ema_rate < 1. Default false
# preserves baseline behavior (target from live encoder).
joint_use_ema_target: false
# If false, block state_loss gradients from reaching the encoder + target_ln
# by running a second trunk forward with z_t.detach() for v_state. action_loss
# still flows into the encoder via the live z_t forward used for v_action.
# Costs ~2x trunk compute. Default true preserves baseline behavior.
joint_state_loss_to_encoder: true
# Encoder + target_ln LR multiplier relative to trunk LR. 1.0 = single param
# group (baseline). < 1 slows the representation vs the trunk (JEDI uses 0.3;
# anti-collapse lever when state_loss flows into the encoder).
joint_encoder_lr_scale: 1.0
# DDT trunk ablation: replace x_state with a learnable global token and pin
# t_state=1 (clean endpoint) inside the trunk's forward. Hard-requires
# joint_state_loss_weight == 0. Isolates the contribution of per-sample
# state generation to action denoising while preserving the trunk's
# attention paths, parameter count, and both heads. Default false preserves
# baseline behavior.
joint_replace_x_state: false
# Mixed-data sampling (expert + IDM rollouts): target fraction of each
# training batch drawn from the expert (primary) dataset. Implemented via
# WeightedRandomSampler over the ConcatDataset so the natural size imbalance
# between expert and rollouts doesn't dilute expert-conditional updates.
# null disables the reweighting (uniform shuffle = natural proportions).
# No-op when the dataset is a single source (no rollouts).
expert_sample_fraction: 0.5
# DDT/decoupled-time variant only (LBMDiTJointDDTAgent) ------------------
# If true, sample independent t_state and t_action per batch (DF-style
# decoupled noising). If false, share a single t between streams (recovers
# E2E behavior on the new trunk for A/B comparison).
joint_decouple_t: true
# Play-data ablation: drop the both-near-noise corner of the decoupled
# (t_state, t_action) square for play-source samples (joint generation stays
# expert-only); tau = pre-shift base-t threshold. No-op when decouple_t=false.
joint_play_avoid_both_noise: false
joint_play_both_noise_tau: 0.5
# Inference (t_state, t_action) trajectory through [0, 1]^2.
#   "diagonal":    t_state == t_action at every step (single Euler walk).
#   "state_first": clean state in first half, then clean action.
#   "pyramid":     t_state leads t_action by a fixed offset throughout.
#   "action_only": t_state pinned at eps; only action walks. Ablation for
#                  the value of joint state denoising; pair with
#                  joint_sample_mode == "stochastic" so x_state inits to
#                  randn (in-distribution for the trunk at t_state ≈ eps).
joint_t_schedule: "diagonal"
# Pyramid offset (used only when joint_t_schedule == "pyramid").
joint_pyramid_offset: 0.2
# Small epsilon to keep schedule endpoints in [eps, 1-eps]. 0 disables.
joint_t_eps: 0.0
# Per-stream SD3-style time shift t' = a*t / (1 + (a-1)*t). With t=0=noise,
# t=1=data: a < 1 emphasizes noise (UNITE-style), a > 1 emphasizes data.
# Default 1.0 (no shift) keeps current behavior. Same shift used at both
# training and inference for the matching stream.
joint_t_shift_state: 1.0
joint_t_shift_action: 1.0
# Base distribution for training t (before shift). "uniform" or "logit_normal".
joint_t_dist: "uniform"
joint_t_dist_mu: 0.0
joint_t_dist_sigma: 1.0
# State-head parameterization for DDT/PT joint agents.
#   "velocity": net's state-head output IS v_state; loss = MSE(v_state - s_t_dot).
#               Baseline / backwards-compatible.
#   "x1":       UNITE-style. Net output is treated as the x1-estimate of the
#               LN'd goal-obs embedding; target_ln is applied to it so the
#               prediction lives in the same manifold as the target, then
#               v_state = (target_ln(s_pred) - s_t) / (1 - t_state) is derived
#               for both the loss and Euler integration. The same clamped
#               denominator is applied to v_gt (matches UNITE). Loss form
#               stays velocity-MSE (equivalent to x1-MSE with 1/(1-t)^2
#               weighting). For full UNITE faithfulness, also set
#               joint_target_ln_affine=true and joint_t_dist="logit_normal".
joint_state_param: "velocity"
# Action-head parameterization for DDT/PT joint agents.
#   "velocity": net's action-head output IS v_action; loss = MSE(v_action - a_t_dot).
#               Baseline / backwards-compatible.
#   "x1":       Net output is the x1-estimate a_pred of the clean action chunk;
#               v_action = (a_pred - a_t) / (1 - t_action) derived for both
#               loss and integration. No LN (actions aren't a learned manifold).
#               Loss form stays velocity-MSE (equivalent to x1-MSE with
#               1/(1-t)^2 weighting; matches PI-0 / standard FM policies).
joint_action_param: "velocity"
# Floor on (1 - t) when deriving v from x1-prediction under the x1
# parameterization. Mirrors UNITE's train_eps/sample_eps=5e-2 clamp; used by
# both state and action streams when their respective param is "x1".
joint_x1_pred_eps: 0.05
