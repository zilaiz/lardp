defaults:
  - log: default
  - optimization: default
  - network: mlp
  - lam: default
  - task: lift_ph_state
  - launcher: basic
  - _self_

mode: "train"

# Auto-generated experiment name
log:
  exp_name: "${task.env_name}_${task.env_type}_${task.obs_type}_${optimization.loss_type}_${task.latent_type}_${network.network_type}_${network.emb_dim}_seed${optimization.seed}${suffix:${log.exp_note}}"
  log_dir: "logs/${log.exp_name}/${now:%Y_%m_%d_%H_%M_%S}"
